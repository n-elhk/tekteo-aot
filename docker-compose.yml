services:
  postgres:
    image: postgres:18-alpine
    container_name: tekteo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tekteo
      POSTGRES_PASSWORD: tekteo
      POSTGRES_DB: tekteo
    ports:
      - '5432:5432'
    volumes:
      - tekteo-pg:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tekteo -d tekteo']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: tekteo-redis
    restart: unless-stopped
    command: redis-server --save '' --appendonly no
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  tekteo-pg:
