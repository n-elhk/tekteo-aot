[project]
name = "cv-worker"
version = "0.1.0"
description = "Tekteo CV worker — extraction PDF/DOCX → CvData via Mistral.rs"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "openai>=1.55",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "docling>=2.0",
    "jinja2>=3.1",
    "weasyprint>=63.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
