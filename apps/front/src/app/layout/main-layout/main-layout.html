<div class="min-h-dvh flex">
  <!-- Sidebar -->
  <aside
    class="fixed inset-y-0 left-0 z-30 w-72 transform bg-surface-950 text-white transition-transform duration-300 ease-out lg:translate-x-0 lg:relative lg:flex"
    [class.-translate-x-full]="!sidebarOpen()"
    [class.translate-x-0]="sidebarOpen()"
    aria-label="Navigation principale"
  >
    <div class="flex w-full flex-col">
      <!-- Marque -->
      <div class="flex items-center gap-3 px-6 py-6 border-b border-white/10">
        <span class="relative inline-flex h-10 w-10 items-center justify-center rounded-xl bg-gradient-to-br from-brand-400 via-brand-500 to-accent-500 shadow-glow">
          <span class="absolute inset-0 rounded-xl bg-white/20 blur-md"></span>
          <span class="relative font-display text-lg font-bold">T</span>
        </span>
        <div class="flex flex-col leading-tight">
          <span class="font-semibold text-white">Tekteo</span>
          <span class="text-xs text-white/60">Plateforme AO</span>
        </div>
      </div>

      <!-- Navigation -->
      <nav class="flex-1 overflow-y-auto px-3 py-4">
        <ul class="space-y-1">
          @for (item of navItems(); track item.path) {
            <li>
              <a
                [routerLink]="item.path"
                routerLinkActive="bg-white/10 text-white shadow-inner"
                #rla="routerLinkActive"
                [attr.aria-current]="rla.isActive ? 'page' : null"
                (click)="closeSidebar()"
                class="group flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-white/70 hover:bg-white/5 hover:text-white transition"
              >
                <svg viewBox="0 0 24 24" class="h-5 w-5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="item.icon" />
                </svg>
                <span class="truncate">{{ item.label }}</span>
              </a>
            </li>
          }
        </ul>
      </nav>

      <!-- Compte -->
      <div class="border-t border-white/10 px-4 py-4">
        @if (user(); as u) {
          <div class="flex items-center gap-3">
            <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-gradient-to-br from-accent-400 to-accent-600 text-sm font-semibold text-white">
              {{ initials() }}
            </div>
            <div class="min-w-0 flex-1">
              <p class="truncate text-sm font-medium text-white">{{ displayName() }}</p>
              <p class="truncate text-xs text-white/50">{{ u.email }}</p>
            </div>
            <button
              type="button"
              (click)="logout()"
              class="rounded-lg p-2 text-white/60 hover:bg-white/10 hover:text-white transition"
              aria-label="Se déconnecter"
            >
              <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12H3m0 0l4-4m-4 4l4 4M21 5v14" />
              </svg>
            </button>
          </div>
        }
      </div>
    </div>
  </aside>

  <!-- Voile mobile -->
  @if (sidebarOpen()) {
    <button
      type="button"
      class="fixed inset-0 z-20 bg-surface-950/40 backdrop-blur-sm lg:hidden"
      aria-label="Fermer la navigation"
      (click)="closeSidebar()"
    ></button>
  }

  <!-- Contenu -->
  <div class="flex min-h-dvh min-w-0 flex-1 flex-col">
    <header class="sticky top-0 z-10 flex items-center justify-between gap-3 border-b border-surface-200/70 bg-white/70 px-4 py-3 backdrop-blur-md lg:px-8">
      <div class="flex items-center gap-3">
        <button
          type="button"
          (click)="toggleSidebar()"
          class="inline-flex h-10 w-10 items-center justify-center rounded-xl border border-surface-200 bg-white text-surface-900 shadow-sm transition hover:border-brand-300 hover:text-brand-700 lg:hidden"
          aria-label="Ouvrir la navigation"
          [attr.aria-expanded]="sidebarOpen()"
        >
          <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
        <h1 class="text-base font-semibold text-surface-900">Bienvenue sur Tekteo</h1>
      </div>
    </header>

    <main class="flex-1 px-4 py-6 lg:px-8 lg:py-10">
      <router-outlet />
    </main>
  </div>
</div>
