<div class="space-y-6">
  <!-- En-tête -->
  <header class="flex flex-wrap items-start justify-between gap-3">
    <div class="space-y-1">
      <p class="text-sm font-medium text-brand-700">Veille</p>
      <h1 class="text-3xl font-semibold tracking-tight text-surface-900">
        Veille d'appels d'offres
      </h1>
      <p class="text-sm text-surface-900/60">
        Recherchez dans le BOAMP en temps réel, marquez vos favoris et lancez
        une analyse IA en un clic.
      </p>
    </div>
  </header>

  <!-- Filtres -->
  <app-card title="Recherche">
    <app-ao-search-filters
      (searched)="onSearched($event)"
      (resetFilters)="onReset()"
    />
  </app-card>

  <!-- Onglets -->
  <div class="flex flex-wrap items-center justify-between gap-3">
    <div
      class="inline-flex items-center gap-2"
      role="tablist"
      aria-label="Vue résultats ou favoris"
    >
      <button
        type="button"
        role="tab"
        [attr.aria-selected]="activeTab() === 'results'"
        (click)="setActiveTab('results')"
        class="inline-flex items-center gap-2 rounded-full px-4 py-1.5 text-sm font-medium transition focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-500"
        [class.bg-brand-600]="activeTab() === 'results'"
        [class.text-white]="activeTab() === 'results'"
        [class.shadow-sm]="activeTab() === 'results'"
        [class.bg-white]="activeTab() !== 'results'"
        [class.text-surface-900]="activeTab() !== 'results'"
        [class.border]="activeTab() !== 'results'"
        [class.border-surface-200]="activeTab() !== 'results'"
        [class.hover:border-brand-300]="activeTab() !== 'results'"
      >
        Résultats ({{ totalCount() }})
      </button>
      <button
        type="button"
        role="tab"
        [attr.aria-selected]="activeTab() === 'favoris'"
        (click)="setActiveTab('favoris')"
        class="inline-flex items-center gap-2 rounded-full px-4 py-1.5 text-sm font-medium transition focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-500"
        [class.bg-brand-600]="activeTab() === 'favoris'"
        [class.text-white]="activeTab() === 'favoris'"
        [class.shadow-sm]="activeTab() === 'favoris'"
        [class.bg-white]="activeTab() !== 'favoris'"
        [class.text-surface-900]="activeTab() !== 'favoris'"
        [class.border]="activeTab() !== 'favoris'"
        [class.border-surface-200]="activeTab() !== 'favoris'"
        [class.hover:border-brand-300]="activeTab() !== 'favoris'"
      >
        <svg
          viewBox="0 0 24 24"
          class="h-4 w-4"
          [attr.fill]="activeTab() === 'favoris' ? 'currentColor' : 'none'"
          stroke="currentColor"
          stroke-width="1.6"
          aria-hidden="true"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M11.48 3.5L13.85 8.3l5.3.77-3.83 3.74.9 5.27L11.48 15.6 6.74 18.08l.9-5.27L3.81 9.07l5.3-.77z"
          />
        </svg>
        Favoris ({{ favoritesCount() }})
      </button>
    </div>
    @if (hasSearched()) {
    <button
      type="button"
      (click)="refresh()"
      [disabled]="isLoading()"
      class="inline-flex items-center gap-1.5 rounded-lg border border-surface-200 bg-white px-3 py-1.5 text-sm font-medium text-surface-900/80 hover:border-brand-300 hover:text-brand-700 disabled:opacity-50 disabled:cursor-not-allowed transition"
    >
      <svg
        viewBox="0 0 24 24"
        class="h-4 w-4"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        aria-hidden="true"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M4 4v5h5M20 20v-5h-5M4 9a8 8 0 0114-3M20 15a8 8 0 01-14 3"
        />
      </svg>
      Actualiser
    </button>
    }
  </div>

  <!-- Contenu -->
  @if (activeTab() === 'results') {
  <app-ao-veille-results-list
    [items]="resultItems()"
    [hasSearched]="hasSearched()"
    [hasError]="hasError()"
    [isLoading]="isLoading()"
    [totalCount]="totalCount()"
    [currentPage]="currentPage()"
    [totalPages]="totalPages()"
    (favoriteToggled)="toggleFavorite($event)"
    (analyseRequested)="openAnalyseModal($event)"
    (createProjectRequested)="createProject($event)"
    (cctpFileSelected)="handleCctpFile($event)"
    (pageChanged)="onPageChanged($event)"
  />
  } @else {
  <app-ao-veille-favorites-list
    [items]="favoriteItems()"
    (favoriteToggled)="toggleFavorite($event)"
    (analyseRequested)="openAnalyseModal($event)"
    (createProjectRequested)="createProject($event)"
    (cctpFileSelected)="handleCctpFile($event)"
  />
  }
</div>
