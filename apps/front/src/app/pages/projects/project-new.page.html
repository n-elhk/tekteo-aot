<div class="mx-auto max-w-3xl space-y-6">
  <header class="space-y-2">
    <a
      routerLink="/projects"
      class="inline-flex items-center gap-1.5 text-sm font-medium text-surface-900/60 hover:text-brand-700 transition"
    >
      <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
      </svg>
      Retour aux projets
    </a>
    <h1 class="text-3xl font-semibold tracking-tight text-surface-900">
      Nouveau projet d'appel d'offres
    </h1>
    <p class="text-sm text-surface-900/60">
      Renseignez les informations principales — vous pourrez compléter
      les sections, profils et grilles ultérieurement.
    </p>
  </header>

  <form
    [formRoot]="projectForm"
    (submit)="onSubmit()"
    novalidate
    class="space-y-5"
  >
    <app-card title="Identification">
      <div class="grid gap-4 sm:grid-cols-2">
        <label class="flex flex-col gap-1.5">
          <span class="text-sm font-medium text-surface-900">Nom du projet *</span>
          <input
            type="text"
            [formField]="projectForm.name"
            class="block w-full rounded-xl border border-surface-200 bg-white px-3.5 py-2.5 text-sm shadow-sm focus:border-brand-500 focus:ring-2 focus:ring-brand-500/30 focus:outline-none transition"
            placeholder="Ex. Modernisation portail GRDF"
          />
          @if (projectForm.name().touched() && projectForm.name().errors().length > 0) {
            <span class="text-xs font-medium text-red-600">
              {{ projectForm.name().errors()[0].message }}
            </span>
          }
        </label>

        <label class="flex flex-col gap-1.5">
          <span class="text-sm font-medium text-surface-900">Client *</span>
          <input
            type="text"
            [formField]="projectForm.clientName"
            class="block w-full rounded-xl border border-surface-200 bg-white px-3.5 py-2.5 text-sm shadow-sm focus:border-brand-500 focus:ring-2 focus:ring-brand-500/30 focus:outline-none transition"
            placeholder="Ex. GRDF"
          />
          @if (projectForm.clientName().touched() && projectForm.clientName().errors().length > 0) {
            <span class="text-xs font-medium text-red-600">
              {{ projectForm.clientName().errors()[0].message }}
            </span>
          }
        </label>

        <label class="flex flex-col gap-1.5">
          <span class="text-sm font-medium text-surface-900">Référence du marché</span>
          <input
            type="text"
            [formField]="projectForm.marketReference"
            class="block w-full rounded-xl border border-surface-200 bg-white px-3.5 py-2.5 text-sm shadow-sm focus:border-brand-500 focus:ring-2 focus:ring-brand-500/30 focus:outline-none transition"
            placeholder="Ex. AO-2026-014"
          />
          @if (projectForm.marketReference().touched() && projectForm.marketReference().errors().length > 0) {
            <span class="text-xs font-medium text-red-600">
              {{ projectForm.marketReference().errors()[0].message }}
            </span>
          }
        </label>

        <label class="flex flex-col gap-1.5">
          <span class="text-sm font-medium text-surface-900">Date limite de remise</span>
          <input
            type="date"
            [formField]="projectForm.deadline"
            class="block w-full rounded-xl border border-surface-200 bg-white px-3.5 py-2.5 text-sm shadow-sm focus:border-brand-500 focus:ring-2 focus:ring-brand-500/30 focus:outline-none transition"
          />
        </label>

        <label class="flex flex-col gap-1.5 sm:col-span-2">
          <span class="text-sm font-medium text-surface-900">Objet du marché</span>
          <textarea
            [formField]="projectForm.marketObject"
            rows="4"
            class="block w-full resize-y rounded-xl border border-surface-200 bg-white px-3.5 py-2.5 text-sm shadow-sm focus:border-brand-500 focus:ring-2 focus:ring-brand-500/30 focus:outline-none transition"
            placeholder="Description synthétique du besoin et du périmètre..."
          ></textarea>
          @if (projectForm.marketObject().touched() && projectForm.marketObject().errors().length > 0) {
            <span class="text-xs font-medium text-red-600">
              {{ projectForm.marketObject().errors()[0].message }}
            </span>
          }
        </label>

        <label class="flex flex-col gap-1.5">
          <span class="text-sm font-medium text-surface-900">Durée (mois)</span>
          <input
            type="number"
            inputmode="numeric"
            [formField]="projectForm.durationMonths"
            class="block w-full rounded-xl border border-surface-200 bg-white px-3.5 py-2.5 text-sm shadow-sm focus:border-brand-500 focus:ring-2 focus:ring-brand-500/30 focus:outline-none transition"
            placeholder="12"
          />
        </label>
      </div>
    </app-card>

    <div class="flex items-center justify-end gap-2">
      <a routerLink="/projects">
        <app-button variant="ghost" type="button">Annuler</app-button>
      </a>
      <app-button
        type="submit"
        variant="primary"
        [disabled]="!canSubmit()"
        [loading]="projectForm().submitting()"
      >
        Créer le projet
      </app-button>
    </div>
  </form>
</div>
